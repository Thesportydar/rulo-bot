# Rulo MEP -> USDT -> ARS
#   1. buy:     comprar USD MEP con ARS          (se usa el ask, ARS por USD)
#   2. convert: convertir USD a USDT             (se usa el ask, USD por USDT)
#   3. sell:    vender USDT por ARS              (se usa el bid, ARS por USDT)
# Se evalúan todas las combinaciones buy x convert x sell.
# `platform` identifica la plataforma entre pasos (ej. MEP y conversión en Fiwind = sin transferencia).
# `source` es la fuente de precios y `slug` el id del proveedor en esa fuente.

# Monto de referencia en USDT; CriptoYa ajusta el precio según volumen.
amount_usdt = 1000
# Intervalo de polling en segundos (lo usa scripts/install_launchd.sh).
interval_seconds = 120

[thresholds]
open_pct = 1.0     # avisar cuando la mejor ruta llega a este %
strong_pct = 1.5   # marcar como 🔥
improve_pct = 0.3  # volver a avisar si mejora esta cantidad de puntos sobre el último aviso
close_pct = 0.8    # considerar cerrada por debajo de esto (histéresis para no rebotar)
top_routes = 5     # cuántas rutas listar en el aviso

[market]
timezone = "America/Argentina/Buenos_Aires"
days = [0, 1, 2, 3, 4]  # lunes=0
open = "11:00"
close = "17:00"

[freshness]
max_age_minutes = 30  # descarta cotizaciones con timestamp más viejo que esto

[telegram]
# Token y chat id en .env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
enabled = true

